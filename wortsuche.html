<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wortsuche</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    padding: 20px;
    /* prevent page bounce/scroll during game */
    overscroll-behavior: none;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 6px;
    color: #e94560;
    letter-spacing: 2px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }

  /* Category selection */
  #category-screen { max-width: 700px; margin: 0 auto; }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    margin-top: 10px;
  }

  .cat-btn {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    padding: 22px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: #eee;
    /* larger touch target */
    min-height: 110px;
  }

  .cat-btn:active {
    border-color: #e94560;
    transform: scale(0.97);
  }

  .cat-btn .icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }
  .cat-btn .name { font-weight: 600; font-size: 1rem; }
  .cat-btn .count { font-size: 0.78rem; color: #888; margin-top: 4px; }

  /* Game screen */
  #game-screen { display: none; max-width: 1100px; margin: 0 auto; }

  .game-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .back-btn {
    background: #0f3460;
    border: none;
    color: #eee;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    min-height: 44px; /* Apple HIG minimum touch target */
    transition: background 0.2s;
  }
  .back-btn:active { background: #e94560; }

  .game-title { font-size: 1.3rem; font-weight: 700; color: #e94560; flex: 1; }

  #timer {
    font-size: 1.1rem;
    font-weight: 600;
    color: #0f9;
    min-width: 70px;
    text-align: right;
  }

  /* Layout: grid left, word list right (or stacked on small screens) */
  .game-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Grid */
  #grid-container {
    /* block scroll/pan on this element so swipe = select */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #grid {
    display: grid;
    gap: 3px;
    background: #16213e;
    border-radius: 12px;
    padding: 10px;
    border: 2px solid #0f3460;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 6px;
    background: #1a1a2e;
    transition: background 0.08s;
    letter-spacing: 0;
    cursor: default;
  }

  .cell.highlighted { background: #e94560; color: #fff; }
  .cell.found       { background: #0f3460; color: #0ff; }
  .cell.found.highlighted { background: #095; color: #fff; }

  /* Word list */
  .word-list-panel { min-width: 180px; flex: 1; max-width: 260px; }

  .word-list-panel h3 {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #word-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #word-list li {
    padding: 9px 14px;
    border-radius: 8px;
    background: #16213e;
    border: 2px solid #0f3460;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: all 0.3s;
  }

  #word-list li.found {
    background: #0a3d2e;
    border-color: #0f9;
    color: #0f9;
    text-decoration: line-through;
    opacity: 0.7;
  }

  /* Difficulty */
  .diff-row { display: flex; gap: 6px; align-items: center; }
  .diff-btn {
    background: #0f3460;
    border: 2px solid transparent;
    color: #eee;
    padding: 7px 13px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.8rem;
    min-height: 36px;
    transition: all 0.2s;
  }
  .diff-btn.active { border-color: #e94560; color: #e94560; }
  .diff-btn:active { opacity: 0.7; }

  /* Win screen */
  #win-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .win-box {
    background: #16213e;
    border: 2px solid #e94560;
    border-radius: 16px;
    padding: 36px 44px;
    text-align: center;
    max-width: 360px;
    width: 90%;
  }

  .win-box h2 { font-size: 2rem; color: #e94560; margin-bottom: 10px; }
  .win-box p  { color: #aaa; margin-bottom: 16px; }
  .win-box .time { font-size: 1.5rem; color: #0f9; font-weight: 700; margin-bottom: 20px; }

  .win-btn {
    background: #e94560;
    border: none;
    color: #fff;
    padding: 13px 28px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    margin: 6px;
    min-height: 48px;
    transition: opacity 0.2s;
  }
  .win-btn:active { opacity: 0.8; }
  .win-btn.secondary { background: #0f3460; }

  /* Responsive cell size */
  @media (max-width: 500px) {
    .cell { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<h1>🔤 Wortsuche</h1>
<p class="subtitle">Wähle eine Kategorie und finde alle versteckten Wörter!</p>

<!-- Category Selection -->
<div id="category-screen">
  <div class="category-grid" id="cat-grid"></div>
</div>

<!-- Game Screen -->
<div id="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="showCategories()">← Kategorien</button>
    <div class="game-title" id="game-cat-title"></div>
    <div class="diff-row">
      <button class="diff-btn active" onclick="setDiff('leicht')">Leicht</button>
      <button class="diff-btn" onclick="setDiff('mittel')">Mittel</button>
      <button class="diff-btn" onclick="setDiff('schwer')">Schwer</button>
    </div>
    <div id="timer">00:00</div>
  </div>
  <div class="game-layout">
    <div id="grid-container">
      <div id="grid"></div>
    </div>
    <div class="word-list-panel">
      <h3>Zu finden</h3>
      <ul id="word-list"></ul>
    </div>
  </div>
</div>

<!-- Win Screen -->
<div id="win-screen">
  <div class="win-box">
    <h2>🎉 Gewonnen!</h2>
    <p>Du hast alle Wörter gefunden!</p>
    <div class="time" id="win-time"></div>
    <br>
    <button class="win-btn" onclick="restartGame()">Nochmal spielen</button>
    <button class="win-btn secondary" onclick="showCategories()">Kategorien</button>
  </div>
</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const CATEGORIES = [
  {
    id: 'tiere', name: 'Tiere', icon: '🐾',
    words: ['HUND','KATZE','VOGEL','PFERD','TIGER','LOEWE','ELEFANT','DELFIN','PINGUIN','KOALA','GEPARD','STRAUSS','HAMSTER','KANINCHEN','KROKODIL']
  },
  {
    id: 'laender', name: 'Länder', icon: '🌍',
    words: ['DEUTSCHLAND','FRANKREICH','ITALIEN','SPANIEN','SCHWEIZ','OESTERREICH','BRASILIEN','JAPAN','CHINA','KANADA','AUSTRALIEN','AEGYPTEN','INDIEN','MEXIKO','NORWEGEN']
  },
  {
    id: 'sport', name: 'Sport', icon: '⚽',
    words: ['FUSSBALL','TENNIS','SCHWIMMEN','RADFAHREN','TURNEN','BOXEN','GOLF','VOLLEYBALL','BASKETBALL','SKIFAHREN','REITEN','HANDBALL','FECHTEN','RUDERN','KLETTERN']
  },
  {
    id: 'essen', name: 'Essen', icon: '🍕',
    words: ['PIZZA','SPAGHETTI','SALAT','SUPPE','BROT','KUCHEN','SCHNITZEL','WURST','FONDUE','SUSHI','BURGER','NUDELN','REIS','TOMATE','GURKE']
  },
  {
    id: 'berufe', name: 'Berufe', icon: '💼',
    words: ['ARZT','LEHRER','BACKER','KOCH','PILOT','RICHTER','ARCHITEKT','INGENIEUR','MUSIKER','MALER','SCHREINER','MECHANIKER','POLIZIST','ZAHNARZT','GAERTNER']
  },
  {
    id: 'farben', name: 'Farben', icon: '🎨',
    words: ['ROT','BLAU','GRUEN','GELB','ORANGE','LILA','PINK','BRAUN','SCHWARZ','WEISS','GRAU','TUERKIS','BEIGE','GOLD','SILBER']
  },
  {
    id: 'musik', name: 'Musik', icon: '🎵',
    words: ['GITARRE','KLAVIER','GEIGE','TROMPETE','SCHLAGZEUG','FLOETE','CELLO','SAXOPHON','ORGEL','HARFE','BRATSCHE','TUBA','AKKORDEON','KEYBOARD','POSAUNE']
  },
  {
    id: 'natur', name: 'Natur', icon: '🌿',
    words: ['WALD','BERG','SEE','FLUSS','WIESE','STRAND','VULKAN','WUESTE','DSCHUNGEL','GLETSCHER','PRAIRIE','SAVANNE','MOOR','DELTA','LAGUNE']
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentCat = null;
let gridData   = [];
let gridSize   = 14;
let cellPx     = 40;   // computed cell pixel size
let placedWords = [];
let foundWords  = new Set();
let selecting   = false;
let startCell   = null;
let currentSelection = [];
let timerInterval = null;
let seconds = 0;
let difficulty = 'leicht';

const DIFF_SETTINGS = {
  leicht: { size: 12, count: 8  },
  mittel: { size: 14, count: 10 },
  schwer: { size: 16, count: 13 }
};

// ─── CATEGORY SCREEN ──────────────────────────────────────────────────────────
function showCategories() {
  document.getElementById('category-screen').style.display = '';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('win-screen').style.display = 'none';
  stopTimer();
}

function renderCategories() {
  document.getElementById('cat-grid').innerHTML = CATEGORIES.map(c => `
    <div class="cat-btn" onclick="startGame('${c.id}')">
      <span class="icon">${c.icon}</span>
      <div class="name">${c.name}</div>
      <div class="count">${c.words.length} Wörter</div>
    </div>
  `).join('');
}

// ─── DIFFICULTY ───────────────────────────────────────────────────────────────
function setDiff(d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase() === d);
  });
  if (currentCat) startGame(currentCat.id);
}

// ─── GAME START ───────────────────────────────────────────────────────────────
function startGame(catId) {
  currentCat = CATEGORIES.find(c => c.id === catId);
  const { size, count } = DIFF_SETTINGS[difficulty];
  gridSize = size;

  document.getElementById('category-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('win-screen').style.display = 'none';
  document.getElementById('game-cat-title').textContent = currentCat.icon + ' ' + currentCat.name;

  foundWords = new Set();
  stopTimer(); seconds = 0; updateTimerDisplay(); startTimer();

  const pool = [...currentCat.words].sort(() => Math.random() - 0.5).slice(0, count);
  buildGrid(pool);
  renderWordList();
}

function restartGame() {
  document.getElementById('win-screen').style.display = 'none';
  startGame(currentCat.id);
}

// ─── GRID GENERATION ──────────────────────────────────────────────────────────
const DIRS = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];

function buildGrid(words) {
  gridData = Array.from({length: gridSize}, () => Array(gridSize).fill(''));
  placedWords = [];

  for (const word of [...words].sort((a,b) => b.length - a.length))
    placeWord(word);

  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (let r = 0; r < gridSize; r++)
    for (let c = 0; c < gridSize; c++)
      if (!gridData[r][c]) gridData[r][c] = alpha[Math.floor(Math.random() * 26)];

  computeCellSize();
  renderGrid();
}

function placeWord(word) {
  const dirs = [...DIRS].sort(() => Math.random() - 0.5);
  for (let attempt = 0; attempt < 300; attempt++) {
    const dir = dirs[attempt % dirs.length];
    const r = Math.floor(Math.random() * gridSize);
    const c = Math.floor(Math.random() * gridSize);
    if (canPlace(word, r, c, dir)) { doPlace(word, r, c, dir); return; }
  }
}

function canPlace(word, r, c, [dr, dc]) {
  for (let i = 0; i < word.length; i++) {
    const nr = r + dr*i, nc = c + dc*i;
    if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize) return false;
    const ex = gridData[nr][nc];
    if (ex && ex !== word[i]) return false;
  }
  return true;
}

function doPlace(word, r, c, [dr, dc]) {
  const cells = [];
  for (let i = 0; i < word.length; i++) {
    const nr = r + dr*i, nc = c + dc*i;
    gridData[nr][nc] = word[i];
    cells.push([nr, nc]);
  }
  placedWords.push({ word, cells });
}

// ─── RESPONSIVE CELL SIZE ─────────────────────────────────────────────────────
function computeCellSize() {
  // Available width = viewport minus padding minus word list
  const vw = Math.min(window.innerWidth, 1100);
  const wordPanelW = vw >= 600 ? 220 : 0;
  const padding = 60; // body padding + gap
  const available = vw - wordPanelW - padding;
  const gap = 3;
  // cell = (available - gaps) / gridSize
  cellPx = Math.floor((available - gap * (gridSize - 1)) / gridSize);
  cellPx = Math.max(28, Math.min(cellPx, 48)); // clamp 28–48 px
}

// ─── RENDER GRID ──────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${gridSize}, ${cellPx}px)`;
  grid.innerHTML = '';

  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.width  = cellPx + 'px';
      cell.style.height = cellPx + 'px';
      cell.style.fontSize = Math.max(11, cellPx * 0.44) + 'px';
      cell.textContent = gridData[r][c];
      cell.dataset.r = r;
      cell.dataset.c = c;
      grid.appendChild(cell);
    }
  }

  // Attach pointer events once on the container (works for finger & Apple Pencil)
  const container = document.getElementById('grid-container');
  container.onpointerdown  = onPointerDown;
  container.onpointermove  = onPointerMove;
  container.onpointerup    = onPointerUp;
  container.onpointercancel = onPointerUp;
  // also keep mouse for desktop
  container.onmousedown = onPointerDown;
  document.addEventListener('mouseup', onPointerUp);
}

function getCell(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

function cellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.classList.contains('cell') ? el : null;
}

// ─── POINTER EVENTS (finger, Apple Pencil, mouse) ────────────────────────────
function onPointerDown(e) {
  // only primary pointer (finger or pencil tip)
  if (e.pointerType && e.buttons === 0 && e.type === 'pointerdown') return;
  e.preventDefault();
  const el = e.target.classList.contains('cell') ? e.target : cellFromPoint(e.clientX, e.clientY);
  if (!el) return;
  selecting = true;
  startCell = { r: +el.dataset.r, c: +el.dataset.c };
  currentSelection = [startCell];
  updateHighlight(currentSelection);
}

function onPointerMove(e) {
  if (!selecting) return;
  e.preventDefault();
  const el = cellFromPoint(e.clientX, e.clientY);
  if (!el) return;
  const r = +el.dataset.r, c = +el.dataset.c;
  const sel = getLineCells(startCell.r, startCell.c, r, c);
  if (sel) { currentSelection = sel; updateHighlight(sel); }
}

function onPointerUp(e) {
  if (!selecting) return;
  selecting = false;
  checkSelection();
  clearHighlight();
}

function getLineCells(r1, c1, r2, c2) {
  const dr = r2 - r1, dc = c2 - c1;
  if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return null;
  const len = Math.max(Math.abs(dr), Math.abs(dc));
  const sr = Math.sign(dr), sc = Math.sign(dc);
  const cells = [];
  for (let i = 0; i <= len; i++) cells.push({ r: r1 + sr*i, c: c1 + sc*i });
  return cells;
}

function updateHighlight(cells) {
  document.querySelectorAll('.cell.highlighted').forEach(el => el.classList.remove('highlighted'));
  cells.forEach(({r, c}) => getCell(r, c)?.classList.add('highlighted'));
}

function clearHighlight() {
  document.querySelectorAll('.cell.highlighted').forEach(el => el.classList.remove('highlighted'));
}

// ─── CHECK WORD ───────────────────────────────────────────────────────────────
function checkSelection() {
  if (!currentSelection.length) return;
  const forward  = currentSelection.map(({r, c}) => gridData[r][c]).join('');
  const backward = [...forward].reverse().join('');

  for (const {word, cells} of placedWords) {
    if (foundWords.has(word)) continue;
    if (word === forward || word === backward) {
      foundWords.add(word);
      cells.forEach(([r, c]) => getCell(r, c)?.classList.add('found'));
      document.querySelector(`#word-list li[data-word="${word}"]`)?.classList.add('found');
      if (foundWords.size === placedWords.length) setTimeout(showWin, 300);
      return;
    }
  }
}

// ─── WORD LIST ────────────────────────────────────────────────────────────────
function renderWordList() {
  document.getElementById('word-list').innerHTML =
    placedWords.map(p => `<li data-word="${p.word}">${p.word}</li>`).join('');
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function startTimer() { timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000); }
function stopTimer()  { clearInterval(timerInterval); }
function updateTimerDisplay() {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}
function formatTime(sec) {
  const m = Math.floor(sec/60), s = sec % 60;
  return m > 0 ? `${m} Min ${s} Sek` : `${s} Sekunden`;
}

// ─── WIN ──────────────────────────────────────────────────────────────────────
function showWin() {
  stopTimer();
  document.getElementById('win-time').textContent = formatTime(seconds);
  document.getElementById('win-screen').style.display = 'flex';
}

// ─── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  if (currentCat && document.getElementById('game-screen').style.display !== 'none') {
    computeCellSize();
    // re-render grid preserving found state
    const foundCells = new Set();
    document.querySelectorAll('.cell.found').forEach(el => foundCells.add(el.dataset.r + ',' + el.dataset.c));
    renderGrid();
    foundCells.forEach(key => {
      const [r, c] = key.split(',');
      getCell(+r, +c)?.classList.add('found');
    });
    // re-mark found words
    foundWords.forEach(word => {
      document.querySelector(`#word-list li[data-word="${word}"]`)?.classList.add('found');
    });
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderCategories();
</script>
</body>
</html>
